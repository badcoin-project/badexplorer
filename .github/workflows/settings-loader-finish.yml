name: Temporary settings loader finish

on:
  push:
    branches:
      - repair/settings-loader-diagnostics

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair validate commit and push
        shell: python
        run: |
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          settings_path = root / 'lib' / 'settings.js'
          loader_test = root / 'test' / 'settingsLoaderSpec.js'
          source = settings_path.read_text()

          broken = "console.warn(`${exports.localization.missing_settings_file.replace('{1}', settings_filename.split('/')[1])}. ${exports.localization.continuing_using_defaults}`);"
          if source.count(broken) != 2:
              raise RuntimeError(f'expected two broken warning sites, got {source.count(broken)}')
          source = source.replace(broken, "const read_error_code = e && e.code ? ` (${e.code})` : '';\n      console.warn(`Unable to read settings file ${settings_filename}${read_error_code}. ${exports.localization.continuing_using_defaults}`);", 1)
          source = source.replace(broken, "console.warn(`${exports.localization.missing_settings_file.replace('{1}', settings_filename)}. ${exports.localization.continuing_using_defaults}`);", 1)

          broken_error = "console.error(`${exports.localization.error_processing_settings.replace('{1}', settings_filename.split('/')[1])}: ${e.message}`);"
          if source.count(broken_error) != 1:
              raise RuntimeError('processing diagnostic site mismatch')
          source = source.replace(broken_error, "const error_name = e && e.name ? e.name : 'Error';\n    console.error(`${exports.localization.error_processing_settings.replace('{1}', settings_filename)}: ${error_name}`);", 1)

          coin_line = "json_settings = fix_deprecated_setting(json_settings, 'coin', 'coin.name');"
          if source.count(coin_line) != 1:
              raise RuntimeError('coin compatibility site mismatch')
          source = source.replace(coin_line, "if (json_settings.coin != null && typeof json_settings.coin !== 'object')\n      json_settings = fix_deprecated_setting(json_settings, 'coin', 'coin.name');", 1)
          settings_path.write_text(source)

          loader_test.write_text(r'''const fs = require('fs');
const path = require('path');

describe('settings loader diagnostics', () => {
  const settingsFile = path.resolve(__dirname, '..', 'lib', 'settings.js');
  const configuredPath = '/etc/badexplorer/settings.json';

  function loadWith(options = {}) {
    const originalExistsSync = fs.existsSync;
    const originalReadFileSync = fs.readFileSync;
    const originalWarn = console.warn;
    const originalError = console.error;
    const originalExit = process.exit;
    const warnings = [];
    const errors = [];
    let loaded;
    let thrown;

    fs.existsSync = function(filename) {
      if (filename === configuredPath) return options.exists !== false;
      return originalExistsSync.apply(fs, arguments);
    };
    fs.readFileSync = function(filename) {
      if (filename === configuredPath) {
        if (options.readError) throw options.readError;
        return options.contents == null ? '{}' : options.contents;
      }
      return originalReadFileSync.apply(fs, arguments);
    };
    console.warn = (message) => warnings.push(String(message));
    console.error = (message) => errors.push(String(message));
    process.exit = (code) => {
      const error = new Error(`process.exit(${code})`);
      error.exitCode = code;
      throw error;
    };

    try {
      delete require.cache[require.resolve(settingsFile)];
      loaded = require(settingsFile);
    } catch (error) {
      thrown = error;
    } finally {
      fs.existsSync = originalExistsSync;
      fs.readFileSync = originalReadFileSync;
      console.warn = originalWarn;
      console.error = originalError;
      process.exit = originalExit;
      delete require.cache[require.resolve(settingsFile)];
    }
    return { loaded, thrown, warnings, errors };
  }

  it('reports the configured path when the settings file is missing', () => {
    const result = loadWith({ exists: false });
    expect(result.thrown).toBeUndefined();
    expect(result.warnings).toContain('The /etc/badexplorer/settings.json file is missing. Continuing using defaults');
  });

  it('distinguishes a read failure without leaking exception text', () => {
    const error = new Error('SECRET_CONTENT_SHOULD_NOT_LEAK');
    error.code = 'EACCES';
    const result = loadWith({ readError: error });
    const output = result.warnings.join('\n');
    expect(result.thrown).toBeUndefined();
    expect(output).toContain('Unable to read settings file /etc/badexplorer/settings.json (EACCES). Continuing using defaults');
    expect(output).not.toContain('SECRET_CONTENT_SHOULD_NOT_LEAK');
  });

  it('distinguishes processing failure and preserves fatal behavior without leaking contents', () => {
    const result = loadWith({ contents: '{"coin":"SECRET_CONTENT_SHOULD_NOT_LEAK"' });
    const output = result.errors.join('\n');
    expect(result.thrown).toBeDefined();
    expect(result.thrown.exitCode).toBe(1);
    expect(output).toContain('There was an error processing the /etc/badexplorer/settings.json file: SyntaxError');
    expect(output).not.toContain('SECRET_CONTENT_SHOULD_NOT_LEAK');
  });

  it('does not treat a modern object-valued coin section as deprecated', () => {
    const result = loadWith({ contents: JSON.stringify({ coin: { symbol: 'BAD', max_supply: 21000000000 } }) });
    expect(result.thrown).toBeUndefined();
    expect(result.loaded.coin.name).toBe('Badcoin');
    expect(result.loaded.coin.symbol).toBe('BAD');
    expect(result.loaded.coin.max_supply).toBe(21000000000);
    expect(result.warnings.some((message) => message.includes("Deprecated setting 'coin'"))).toBeFalse();
  });

  it('maps a legacy scalar coin value to coin.name', () => {
    const result = loadWith({ contents: JSON.stringify({ coin: 'LegacyCoin' }) });
    expect(result.thrown).toBeUndefined();
    expect(result.loaded.coin.name).toBe('LegacyCoin');
    expect(result.loaded.coin.symbol).toBe('BAD');
    expect(result.loaded.coin.max_supply).toBe(21000000000);
    expect(result.warnings.some((message) => message.includes("Deprecated setting 'coin'") && message.includes("'coin.name'"))).toBeTrue();
  });

  it('keeps Badcoin-safe runtime defaults explicit', () => {
    const result = loadWith({ exists: false });
    expect(result.thrown).toBeUndefined();
    expect(result.loaded.coin.name).toBe('Badcoin');
    expect(result.loaded.coin.symbol).toBe('BAD');
    expect(result.loaded.coin.max_supply).toBe(21000000000);
    expect(result.loaded.shared_pages.difficulty).toBe('POW');
  });
});
''')

          def run(label, args, cwd=root):
              result = subprocess.run(args, cwd=cwd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(f'===== {label} =====')
              print(result.stdout)
              print(f'{label}_rc={result.returncode}')
              return result

          install = run('npm_ci', ['npm', 'ci'])
          if install.returncode != 0:
              raise RuntimeError('npm ci failed')

          checks = {
              'node_check_settings': run('node_check_settings', ['node', '--check', 'lib/settings.js']),
              'node_check_loader_test': run('node_check_loader_test', ['node', '--check', 'test/settingsLoaderSpec.js']),
              'node_check_schema_test': run('node_check_schema_test', ['node', '--check', 'test/settingsSchemaSpec.js']),
              'focused_loader_tests': run('focused_loader_tests', ['node', './node_modules/jasmine/bin/jasmine.js', 'test/settingsLoaderSpec.js']),
              'schema_tests': run('schema_tests', ['node', './node_modules/jasmine/bin/jasmine.js', 'test/settingsSchemaSpec.js']),
              'diff_check': run('diff_check', ['git', 'diff', '--check']),
          }
          if any(r.returncode != 0 for r in checks.values()):
              raise RuntimeError('focused validation failed')

          suite = run('npm_test', ['npm', 'test'])
          parity = 'not-needed'
          if suite.returncode != 0:
              base_dir = pathlib.Path('/tmp/badexplorer-base-parity')
              add = run('base_worktree_add', ['git', 'worktree', 'add', '--detach', str(base_dir), 'fdd99ee1318de7761cf7713d57720161705dfe2b'])
              if add.returncode != 0:
                  raise RuntimeError('could not establish baseline parity worktree')
              base_install = run('base_npm_ci', ['npm', 'ci'], cwd=base_dir)
              if base_install.returncode != 0:
                  raise RuntimeError('baseline npm ci failed')
              base_suite = run('base_npm_test', ['npm', 'test'], cwd=base_dir)
              parity = 'same-failure' if base_suite.returncode != 0 else 'repair-only-failure'
              if base_suite.returncode == 0:
                  raise RuntimeError('npm test regression versus authoritative base')

          for workflow in [root / '.github/workflows/settings-loader-repair.yml', root / '.github/workflows/settings-loader-finish.yml']:
              if workflow.exists(): workflow.unlink()

          final_diff = run('final_diff', ['git', 'diff', '--', 'lib/settings.js', 'test/settingsLoaderSpec.js', '.github/workflows/settings-loader-repair.yml', '.github/workflows/settings-loader-finish.yml'])
          final_check = run('final_diff_check', ['git', 'diff', '--check'])
          if final_check.returncode != 0:
              raise RuntimeError('final diff check failed')

          run('git_config_name', ['git', 'config', 'user.name', 'Zako'])
          run('git_config_email', ['git', 'config', 'user.email', '65051353+Jegertabt@users.noreply.github.com'])
          run('git_add', ['git', 'add', 'lib/settings.js', 'test/settingsLoaderSpec.js', '.github/workflows/settings-loader-repair.yml', '.github/workflows/settings-loader-finish.yml'])

          suite_status = 'PASS' if suite.returncode == 0 else f'FAIL with baseline parity={parity}'
          body = '\n'.join([
              'Clarify settings loader diagnostics',
              '',
              'Validation:',
              '- node --check lib/settings.js: PASS',
              '- node --check test/settingsLoaderSpec.js: PASS',
              '- node --check test/settingsSchemaSpec.js: PASS',
              '- focused settings loader tests: PASS',
              '- settings schema tests: PASS',
              f'- npm test: {suite_status}',
              '- git diff --check: PASS',
              '- temporary workflow scaffolding removed from final tree',
          ])
          commit = run('git_commit', ['git', 'commit', '-m', body])
          if commit.returncode != 0:
              raise RuntimeError('final repair commit failed')
          pushed = run('git_push', ['git', 'push', 'origin', 'HEAD:repair/settings-loader-diagnostics'])
          if pushed.returncode != 0:
              raise RuntimeError('final repair push failed')
