name: Settings loader validation

on:
  push:
    branches:
      - repair/settings-loader-diagnostics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check lib/settings.js
      - run: node --check test/settingsLoaderSpec.js
      - run: node --check test/settingsSchemaSpec.js
      - run: node ./node_modules/jasmine/bin/jasmine.js test/settingsLoaderSpec.js
      - run: node ./node_modules/jasmine/bin/jasmine.js test/settingsSchemaSpec.js
      - run: npm test
      - run: git diff --check fdd99ee1318de7761cf7713d57720161705dfe2b...HEAD
